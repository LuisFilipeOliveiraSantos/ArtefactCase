[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (Artefact AI Engineer technical case)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.42.1",
    "pandas>=2.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
emporio = "emporio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
